[package]
name = "audible-news-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.12.0"
# Keep the modern HTTPS client without the legacy `rustls` feature (rustls 0.21).
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws_lambda_events = { version = "1.2.0", features = ["eventbridge"] }
chrono = "0.4.45"
lambda_runtime = "1.4.0"
openssl = { version = "0.10.81", features = ["vendored"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = "0.17.0"
tokio = { version = "1.53.2", features = ["macros"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
